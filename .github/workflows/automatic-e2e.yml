name: M7 automatic E2E validation
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'pyproject.toml'

permissions:
  contents: read

concurrency:
  group: m7-automatic-e2e
  cancel-in-progress: false

jobs:
  end-to-end:
    # Fail closed while the one-time GitHub environment/secret provisioning is incomplete.
    # No human-triggered run or per-run reviewer approval is required after provisioning.
    if: ${{ vars.M7_E2E_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: m7-integration
    env:
      DATABASE_URL: ${{ secrets.M7_DATABASE_URL }}
      OPENAI_COMPAT_BASE_URL: https://omniroute.qjai.org/v1
      OPENAI_COMPAT_API_KEY: ${{ secrets.M7_OMNIROUTE_API_KEY }}
      OPENAI_COMPAT_MODEL: ${{ vars.M7_E2E_MODEL || 'MiniMax-M3' }}
      OPENAI_COMPAT_ALLOW_PRIVATE_HTTP: 'false'
      OPENAI_COMPAT_TIMEOUT_SECONDS: '120'
      OPENAI_COMPAT_REVIEW_COOLDOWN_SECONDS: '90'
      NOTION_API_KEY: ${{ secrets.M7_NOTION_API_KEY }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.M7_NOTION_PARENT_PAGE_ID }}
      M7_SUPABASE_CA_PEM: ${{ secrets.M7_SUPABASE_CA_PEM }}
      M7_E2E_STORY_ID: ${{ vars.M7_E2E_STORY_ID }}
      PGSSLROOTCERT: /tmp/m7-supabase-ca.pem

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate configuration and install CA without logging secrets
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from uuid import UUID

          required = (
              "DATABASE_URL", "OPENAI_COMPAT_API_KEY",
              "OPENAI_COMPAT_MODEL", "NOTION_API_KEY",
              "NOTION_PARENT_PAGE_ID", "M7_SUPABASE_CA_PEM",
              "M7_E2E_STORY_ID",
          )
          absent = [name for name in required if not os.environ.get(name)]
          if absent:
              raise SystemExit("Missing integration configuration names: " + ", ".join(absent))
          if "sslrootcert=" in os.environ["DATABASE_URL"].lower():
              raise SystemExit("Use a portable DATABASE_URL without sslrootcert; PGSSLROOTCERT provides the CA path")
          if "sslmode=verify-full" not in os.environ["DATABASE_URL"].lower():
              raise SystemExit("DATABASE_URL must explicitly require sslmode=verify-full")
          UUID(os.environ["M7_E2E_STORY_ID"])
          UUID(os.environ["NOTION_PARENT_PAGE_ID"])
          path = Path(os.environ["PGSSLROOTCERT"])
          path.write_text(os.environ["M7_SUPABASE_CA_PEM"], encoding="ascii")
          path.chmod(0o600)
          print("Integration configuration is present; CA is ready")
          PY

      - name: Install production package
        run: python -m pip install .

      - name: Generate, quality-check and create an isolated Notion pending-review test page
        shell: bash
        run: |
          set -euo pipefail
          period="$(TZ=Asia/Shanghai date +%F)"
          artifact="$RUNNER_TEMP/m7-pending-artifact.json"
          python -m overseas_story_producer.cli generate \
            --story-id "$M7_E2E_STORY_ID" --period "$period" \
            --output "$artifact" > "$RUNNER_TEMP/m7-generate-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RUNNER_TEMP"]) / "m7-generate-result.json"
          result = json.loads(result_path.read_text(encoding="utf-8"))
          qa = result.get("qa") if isinstance(result, dict) else None
          if not isinstance(qa, dict):
              raise SystemExit("Missing QA diagnostics in generator result")

          allowed_automatic_issues = {
              "Invalid or forbidden title",
              "Story length outside minimum/maximum bounds",
              "Producer must never emit a READY marker",
              "facts_used must be an array of UUIDs",
              "Model referenced facts absent from evidence bundle",
              "Too few traceable source facts",
              "uncertainties must be an array of strings",
              "Story needs at least three readable sections",
              "Original source URL must appear in source note",
              "Story must begin with a Markdown H1",
          }
          automatic_issues = qa.get("issues", [])
          editorial_issues = qa.get("editorial_issues", [])
          if not isinstance(automatic_issues, list):
              automatic_issues = []
          if not isinstance(editorial_issues, list):
              editorial_issues = []
          safe_automatic = [x for x in automatic_issues
                            if isinstance(x, str) and x in allowed_automatic_issues]
          transport = result.get("model_transport", {})
          if not isinstance(transport, dict):
              transport = {}
          safe_modes = {
              key: value if isinstance(value, str) and value in {"sse", "json_fallback"} else "unknown"
              for key, value in (
                  ("author", transport.get("author")),
                  ("reviewer", transport.get("reviewer")),
              )
          }
          safe = {
              "author_transport": safe_modes["author"],
              "reviewer_transport": safe_modes["reviewer"],
              "automatic_score": qa.get("score"),
              "automatic_issue_count": len(automatic_issues),
              "automatic_issues": safe_automatic,
              "unclassified_automatic_issue_count": len(automatic_issues) - len(safe_automatic),
              "editorial_score": qa.get("editorial_score"),
              "editorial_issue_count": len(editorial_issues),
              "unsupported_claim_count": sum(
                  isinstance(x, str) and x.startswith("Unsupported:")
                  for x in editorial_issues
              ),
              "hard_fail": any(
                  isinstance(x, str) and x.startswith("Hard failure:")
                  for x in editorial_issues
              ),
              "combined_gate_passed": qa.get("passes_automatic_checks") is True,
          }
          lines = [
              "### M7 E2E: sanitized model and QA diagnostics",
              f"- Author response transport: `{safe['author_transport']}`",
              f"- Reviewer response transport: `{safe['reviewer_transport']}`",
              f"- Structural QA score: `{safe['automatic_score']}` / 100",
              f"- Structural QA issues: `{safe['automatic_issue_count']}`",
          ]
          lines.extend(f"  - {issue}" for issue in safe_automatic)
          lines.extend([
              f"- Independent editorial score: `{safe['editorial_score']}` / 100",
              f"- Editorial issue count: `{safe['editorial_issue_count']}`",
              f"- Unsupported claim count: `{safe['unsupported_claim_count']}`",
              f"- Hard-fail flag: `{safe['hard_fail']}`",
              f"- Combined QA gate: `{'PASS' if safe['combined_gate_passed'] else 'FAIL'}`",
          ])
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(lines) + "\n")
          print("M7 safe QA diagnostics: " + json.dumps(safe, ensure_ascii=False))
          status_path = Path(os.environ["RUNNER_TEMP"]) / "m7-qa-gate-status"
          status_path.write_text("PASS" if safe["combined_gate_passed"] else "FAIL", encoding="ascii")

          PY
          if [ "$(cat "$RUNNER_TEMP/m7-qa-gate-status")" = "FAIL" ]; then
            python -m overseas_story_producer.cli diagnose \
              --input "$artifact" --run-id "$GITHUB_RUN_ID" --commit --e2e-test \
              > "$RUNNER_TEMP/m7-notion-diagnostic-result.json"
            python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "m7-notion-diagnostic-result.json").read_text())
          if result.get("status") != "CREATED_QA_FAILURE_DIAGNOSTIC" or result.get("diagnostic_only") is not True:
              raise SystemExit("Isolated Notion QA diagnostic was not created")
          print("Isolated Notion QA diagnostic created; no article page was submitted.")
          PY
            echo "QA gate FAIL: an isolated diagnostic-only page was written to M7 自动化验收测试区; no article, READY marker, CMS or WeChat action." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python -m overseas_story_producer.cli inspect \
            --input "$artifact" > "$RUNNER_TEMP/m7-inspect-result.json"
          python -m overseas_story_producer.cli submit \
            --input "$artifact" --commit --e2e-test > "$RUNNER_TEMP/m7-notion-result.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "m7-notion-result.json").read_text())
          if result.get("status") != "CREATED_PENDING_REVIEW" or result.get("e2e_test") is not True:
              raise SystemExit("Notion E2E did not create the expected isolated pending-review page")
          print("M7 automatic end-to-end validation PASS: Supabase, author, reviewer, QA and isolated Notion pending page.")
          PY
          echo "M7 automatic E2E PASS: pending-review page created inside 'M7 自动化验收测试区'. No READY marker, CMS, WeChat or publication." >> "$GITHUB_STEP_SUMMARY"
