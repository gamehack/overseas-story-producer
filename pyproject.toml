[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qjai-overseas-story-producer"
version = "0.1.0"
description = "Independent evidence-grounded Chinese story producer for QJAI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
overseas-story-producer = "overseas_story_producer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

