name: Overseas Stories weekly automatic batch production

on:
  schedule:
    # Collector/index refresh runs Monday 03:30 Beijing; batch all eligible backlog.
    - cron: '45 6 * * 1'
      timezone: Asia/Shanghai
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/production.yml'
      - 'pyproject.toml'
  workflow_dispatch:
    inputs:
      mode:
        description: Plan without writing, or produce all eligible READY Notion articles
        type: choice
        required: true
        default: plan
        options: [plan, submit]

permissions:
  contents: read

concurrency:
  group: overseas-stories-production
  cancel-in-progress: false

jobs:
  produce:
    # [backfill] is an explicit one-time owner-authorized push; normal weekly
    # production runs weekly after collector refresh with explicit owner approval.
    if: ${{ (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'submit')) || (github.event_name == 'workflow_dispatch' && inputs.mode == 'plan') || (github.event_name == 'push' && github.actor == 'gamehack' && contains(github.event.head_commit.message, '[backfill]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    environment: m7-integration
    env:
      DATABASE_URL: ${{ secrets.M7_DATABASE_URL }}
      NOTION_API_KEY: ${{ secrets.M7_NOTION_API_KEY }}
      NOTION_PARENT_PAGE_ID: ${{ secrets.M7_NOTION_PARENT_PAGE_ID }}
      M7_SUPABASE_CA_PEM: ${{ secrets.M7_SUPABASE_CA_PEM }}
      M7_PRIORITY_STORY_IDS: ${{ vars.M7_PRIORITY_STORY_IDS }}
      OPENAI_COMPAT_BASE_URL: https://omniroute.qjai.org/v1
      OPENAI_COMPAT_API_KEY: ${{ secrets.M7_OMNIROUTE_API_KEY }}
      OPENAI_COMPAT_MODEL: ${{ vars.M7_E2E_MODEL || 'MiniMax-M3' }}
      OPENAI_COMPAT_REVIEW_COOLDOWN_SECONDS: '90'
      OPENAI_COMPAT_TIMEOUT_SECONDS: '120'
      OPENAI_COMPAT_ALLOW_PRIVATE_HTTP: 'false'
      PGSSLROOTCERT: /tmp/m7-supabase-ca.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate private configuration
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from uuid import UUID
          required = ("DATABASE_URL", "NOTION_API_KEY", "NOTION_PARENT_PAGE_ID", "M7_SUPABASE_CA_PEM")
          absent = [name for name in required if not os.getenv(name)]
          if absent:
              raise SystemExit("Missing configuration names: " + ", ".join(absent))
          uri = os.environ["DATABASE_URL"].lower()
          if "sslmode=verify-full" not in uri or "sslrootcert=" in uri:
              raise SystemExit("Use portable TLS verify-full DATABASE_URL with separate CA")
          UUID(os.environ["NOTION_PARENT_PAGE_ID"])
          target = Path(os.environ["PGSSLROOTCERT"])
          target.write_text(os.environ["M7_SUPABASE_CA_PEM"], encoding="ascii")
          target.chmod(0o600)
          PY
      - name: Install producer
        run: python -m pip install .
      - name: Read-only batch planning
        shell: bash
        run: |
          set -euo pipefail
          python -m overseas_story_producer.cli plan > "$RUNNER_TEMP/production-plan.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          plan = json.loads((Path(os.environ["RUNNER_TEMP"]) / "production-plan.json").read_text())
          if plan["status"] not in {"PLANNED", "SKIPPED"}:
              raise SystemExit("Unexpected plan result")
          print("Production plan: " + plan["status"])
          print("Remaining qualified unique stories: " + str(plan["remaining_count"]))
          PY
      - name: Generate and sign all qualified stories in Notion
        if: ${{ github.event_name == 'schedule' || github.event_name == 'push' || inputs.mode == 'submit' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m overseas_story_producer.cli batch --commit --max-minutes 320 > "$RUNNER_TEMP/production-result.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          result = json.loads((Path(os.environ["RUNNER_TEMP"]) / "production-result.json").read_text())
          print("Batch status: " + result["status"])
          print("New signed Notion stories: " + str(result.get("created", 0)))
          print("Automatic QA rejected: " + str(result.get("qa_rejected", 0)))
          print("Stale/incomplete source rejected: " + str(result.get("source_rejected", 0)))
          print("Malformed JSON candidates quarantined: " + str(result.get("model_rejected", 0)))
          print("Unattempted: " + str(result.get("unattempted", 0)))
          if result["status"] == "PARTIAL_MODEL_REJECTED":
              print("Some cases remain eligible and must be retried during a future safe batch")
          if result["status"] == "PARTIAL_TIME_BUDGET":
              print("More work remains; re-run submit to resume from Notion inventory")
          PY
